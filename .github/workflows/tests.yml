name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      # The CPU-only PyTorch build is far smaller than the default CUDA one.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu

      # The real-model tests are skipped here: they need the 2.4 GB model.
      - name: Run tests
        run: python -m pytest tests -q
